<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Análisis de mercado</title>
<style>
  :root { color-scheme: light dark; --bg: #0a0e14; --text: #e6e9ef; --muted: #8e98aa; }
  @media (prefers-color-scheme: light) { :root { --bg: #f7f8fa; --text: #141a24; --muted: #5d6778; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
    font: 15px/1.55 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { padding: 16px; text-align: center; }
  h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0; }
</style>
</head>
<body>
<main>
<h1>Análisis de mercado</h1>
<p>Web en construcción. Pronto: análisis macro semanal y páginas por activo.</p>
</main>
</body>
</html>
